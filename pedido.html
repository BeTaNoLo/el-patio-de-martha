<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido | El Patio de Martha</title>
    <meta name="description" content="Completa tu pedido en El Patio de Martha." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="page-shell">
      <section class="page-banner">
        <div class="container">
          <p class="eyebrow">Pedido</p>
          <h1>Completa tu pedido</h1>
        </div>
      </section>

      <section class="section">
        <div class="container order-layout">
          <form id="checkout-form" class="form-card order-form">
            <label>
              Nombre
              <input type="text" name="nombre" required placeholder="Tu nombre" />
            </label>
            <label>
              Email
              <input type="email" name="email" required placeholder="tu@email.com" />
            </label>
            <label>
              Teléfono
              <input type="tel" name="telefono" required placeholder="600 123 456" />
            </label>
            <label>
              Dirección
              <textarea name="direccion" rows="3" required placeholder="Calle, número, código postal, ciudad"></textarea>
            </label>
            <label>
              Observaciones
              <textarea name="observaciones" rows="4" placeholder="Indicaciones adicionales o preferencia de entrega"></textarea>
            </label>
            <button type="submit" class="btn btn--primary">Confirmar pedido</button>
          </form>

          <aside class="cart-summary" aria-live="polite">
            <h2>Resumen del pedido</h2>
            <div id="checkout-items"></div>
            <div class="summary-total">
              <span>Subtotal</span>
              <strong id="checkout-total">0 €</strong>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
